name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# Skeleton — enable once AWS credentials and the state bucket are wired:
# required secrets: AWS_ROLE_ARN (OIDC), TF_STATE_BUCKET, TF_STATE_DYNAMODB_TABLE
jobs:
  image:
    name: Build & push images
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Set image tags
        id: meta
        run: |
          SHA=${GITHUB_SHA::8}
          echo "web=${{ steps.ecr.outputs.registry }}/airesume/web:$SHA" >> "$GITHUB_OUTPUT"
          echo "worker=${{ steps.ecr.outputs.registry }}/airesume/worker:$SHA" >> "$GITHUB_OUTPUT"

      - name: Build web image
        run: |
          docker build -f docker/web.Dockerfile -t "${{ steps.meta.outputs.web }}" .
          docker push "${{ steps.meta.outputs.web }}"

      - name: Build worker image
        run: |
          docker build -f docker/worker.Dockerfile -t "${{ steps.meta.outputs.worker }}" .
          docker push "${{ steps.meta.outputs.worker }}"

      - name: Export image tags for terraform
        run: |
          echo "WEB_IMAGE=${{ steps.meta.outputs.web }}" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=${{ steps.meta.outputs.worker }}" >> "$GITHUB_ENV"

  terraform:
    name: Terraform apply (staging)
    runs-on: ubuntu-latest
    needs: image
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Apply
        run: |
          terraform apply -auto-approve \
            -var="environment=staging" \
            -var="container_image_web=$WEB_IMAGE" \
            -var="container_image_worker=$WORKER_IMAGE"
